<!DOCTYPE html>
<html lang="en">
<head>
	<title>{% block title %}{% endblock title %}</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/jsbootstrap.bundle.min.js"></script>
</head>

<!-- Add background -->

<style>
	body {
	  /* Replace colors with your desired hex, rgb, or named colors */
	  background-image: linear-gradient(to bottom, #000000, #333333, #666666);

	  /* Forces the background to stay fixed in the viewport */
	  background-attachment: fixed;

	  /* Ensures the background covers the full viewport window */
	  background-size: cover;

	  /* Fallback minimum height so empty pages still show the gradient */
	  min-height: 100vh;
	  margin: 0;
	}
</style>

<body data-bs-theme="dark">  <!-- add dark mode -->
	<main class="container bg-transparent border-0 my-4">
	<h3 class="text-center text-warning">Cipher Challenge</h3> <!-- centred title text -->
	{% include("_navigation.html") %} <!-- included navigation menu -->
	<section>
		<header>
			{% block header %}{% endblock header %}
		</header>
		<main>
			{% block content %}<p>Nothing to see!</p>{% endblock content %}
		</main>
	</section>
	</main>
</body>

<script>
// Initialize tooltips
var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
  return new bootstrap.Tooltip(tooltipTriggerEl)
})
</script>

</html>
